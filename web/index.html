<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闪回控制台</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle fill='%232f6fed' cx='16' cy='16' r='16'/%3E%3Cpath fill='%23fff' d='M10 16a6 6 0 1 0 6-6v2.4A3.6 3.6 0 1 1 12.4 16H10z'/%3E%3Cpath fill='%23fff' d='M16 8v6l4.4-3z'/%3E%3C/svg%3E">
</head>
<body>
  <div id="login-gate" class="login-gate">
    <form class="login-card" id="login-form">
      <div class="brand"><span class="logo"></span><strong>闪回控制台</strong></div>
      <p class="lead">登录后使用。首次默认账号 admin / flashback，请尽快改密。</p>
      <div class="field"><label>用户名</label><input name="username" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input name="password" type="password" autocomplete="current-password" required></div>
      <div class="actions"><button class="btn primary" type="submit" id="btn-login">登录</button></div>
      <div id="login-msg"></div>
    </form>
  </div>
  <div class="app" hidden>
    <header class="top">
      <div class="brand">
        <span class="logo"></span>
        <strong>闪回控制台</strong>
      </div>
      <form class="search" id="top-search">
        <input name="q" placeholder="搜索表名、实例、任务 ID…">
      </form>
      <div class="top-right">
        <span class="userbox" id="user-box" hidden>
          <span id="user-name"></span>
          <button class="btn ghost small" type="button" id="btn-pwd">改密</button>
          <button class="btn ghost small" type="button" id="btn-logout">退出</button>
        </span>
        <span class="ready"><i id="health-dot"></i><span id="health-text">检测中</span></span>
      </div>
    </header>
    <aside class="side">
      <nav id="nav">
        <a href="#/" data-route="dashboard" data-page="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>仪表盘</a>
        <a href="#/new" data-route="new" data-page="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>闪回任务</a>
        <a href="#/history" data-route="history" data-page="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/><path d="M12 8v4l2.5 1.5"/></svg>历史记录</a>
        <a href="#/instances" data-route="instances" data-page="instances"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>实例地址</a>
        <a href="#/ops" data-route="ops" data-page="ops"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M4.9 6.4l1.6 1.6M17.5 16l1.6 1.6M3.5 12h2.2M18.3 12h2.2M4.9 17.6l1.6-1.6M17.5 8l1.6-1.6"/></svg>运维中心</a>
        <a href="#/users" data-route="users" data-page="users"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c.6-3.2 3.3-5 7-5s6.4 1.8 7 5"/></svg>登录用户</a>
        <a href="#/tools" data-route="tools" data-page="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.5L4 17l3 3 5.2-5.1a4 4 0 0 0 5.5-5.6l-2.4 2.4-2.1-.3-.3-2.1z"/></svg>工具与集成</a>
      </nav>
      <div class="side-block">
        <h4><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12"/><circle cx="4" cy="7" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="17" r="1"/></svg>最近任务</h4>
        <div id="recent-tasks" class="recent">加载中…</div>
      </div>
    </aside>
    <main id="app" class="main"></main>
  </div>
  <div id="perm-modal" class="modal" hidden>
    <form class="modal-card" id="perm-form">
      <h3>页面授权 · <span id="perm-user"></span></h3>
      <p class="lead">查看只能看页面；操作可以新增、保存、删除。管理员始终拥有全部权限。</p>
      <div id="perm-fields"></div>
      <div class="actions">
        <button class="btn primary" type="submit">保存授权</button>
        <button class="btn ghost" type="button" id="btn-perm-cancel">取消</button>
      </div>
      <div id="perm-msg"></div>
    </form>
  </div>
  <div id="pwd-modal" class="modal" hidden>
    <form class="modal-card" id="pwd-form">
      <h3>修改密码</h3>
      <div class="field"><label>原密码</label><input name="old_password" type="password" autocomplete="current-password" required></div>
      <div class="field"><label>新密码</label><input name="new_password" type="password" autocomplete="new-password" required placeholder="至少 6 位"></div>
      <div class="field"><label>确认新密码</label><input name="new_password2" type="password" autocomplete="new-password" required></div>
      <div class="actions">
        <button class="btn primary" type="submit">保存</button>
        <button class="btn ghost" type="button" id="btn-pwd-cancel">取消</button>
      </div>
      <div id="pwd-msg"></div>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
