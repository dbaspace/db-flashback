<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闪回控制台</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle fill='%232f6fed' cx='16' cy='16' r='16'/%3E%3Cpath fill='%23fff' d='M10 16a6 6 0 1 0 6-6v2.4A3.6 3.6 0 1 1 12.4 16H10z'/%3E%3Cpath fill='%23fff' d='M16 8v6l4.4-3z'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo"></span>
        <strong>闪回控制台</strong>
      </div>
      <form class="search" id="top-search">
        <input name="q" placeholder="搜索表名、实例、任务 ID…">
      </form>
      <div class="top-right">
        <span class="ready"><i id="health-dot"></i><span id="health-text">检测中</span></span>
      </div>
    </header>
    <aside class="side">
      <nav id="nav">
        <a href="#/" data-route="new">闪回任务</a>
        <a href="#/history" data-route="history">历史记录</a>
        <a href="#/instances" data-route="instances">实例地址</a>
        <a href="#/ops" data-route="ops">运维中心</a>
        <a href="#/tools" data-route="tools">工具与集成</a>
      </nav>
      <div class="side-block">
        <h4>最近任务</h4>
        <div id="recent-tasks" class="recent">加载中…</div>
      </div>
    </aside>
    <main id="app" class="main"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
